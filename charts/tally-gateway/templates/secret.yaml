{{- if and (not .Values.existingSecret) (or .Values.switchframe.token .Values.authToken) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tally-gateway.fullname" . }}
  labels:
    {{- include "tally-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.switchframe.token }}
  SWITCHFRAME_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.authToken }}
  AUTH_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
